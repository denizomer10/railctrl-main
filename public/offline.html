<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çevrimdışı - TCDD Yönetim V3</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(145deg, #0b1220, #15263f);
        color: #e2e8f0;
      }
      .card {
        width: min(92vw, 460px);
        border: 1px solid #334155;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.86);
        padding: 1.2rem;
        text-align: center;
      }
      .card h1 {
        margin: 0 0 0.6rem;
        font-size: 1.2rem;
      }
      .card p {
        margin: 0;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Bağlantı Yok</h1>
      <p>İnternet bağlantısı geri geldiğinde sayfayı yenileyin.</p>
    </section>
  </body>
</html>
